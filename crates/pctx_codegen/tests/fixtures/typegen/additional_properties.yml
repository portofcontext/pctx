schema:
  type: object
  required:
    - any_additional_props
    - obj_additional_props
    - string_additional_props
    - true_additional_props
    - false_additional_props
    - only_additional_props_primitive
    - only_additional_props_object
  properties:
    any_additional_props:
      type: object
      required:
        - foo
      properties:
        foo:
          type: string
      additionalProperties: true
    obj_additional_props:
      type: object
      required:
        - foo
      properties:
        foo:
          type: string
      additionalProperties:
        type: object
        required:
          - fizz
          - buzz
        properties:
          fizz:
            type: string
          buzz:
            type: number
    string_additional_props:
      type: object
      required:
        - foo
      properties:
        foo:
          type: string
      additionalProperties:
        type: string
    true_additional_props:
      type: object
      required:
        - foo
      properties:
        foo:
          type: string
      additionalProperties: true
    false_additional_props:
      type: object
      required:
        - foo
      properties:
        foo:
          type: string
      additionalProperties: false
    only_additional_props_primitive:
      type: object
      additionalProperties:
        type: string
    only_additional_props_object:
      type: object
      additionalProperties:
        $ref: "#/$defs/AdditionalObject"

  $defs:
    AdditionalObject:
      type: object
      requires:
        - foo
        - bar
      properties:
        foo:
          type: string
        bar:
          type: array
          items:
            type: number

tests:
  valid:
    - id: no-additional-props
      value:
        any_additional_props:
          foo: bar
        obj_additional_props:
          foo: bar
        string_additional_props:
          foo: bar
        true_additional_props:
          foo: bar
        false_additional_props:
          foo: bar
        only_additional_props_primitive: {}
        only_additional_props_object: {}
    - id: with-additional-props
      value:
        any_additional_props:
          foo: bar
          first_additional: true
          second_additional: fizzbuzz
          third_additional: [1, 2, 3]
        obj_additional_props:
          foo: bar
          first_additional:
            fizz: one
            buzz: 1
          second_additional:
            fizz: two
            buzz: 2
          third_additional:
            fizz: three
            buzz: 3
        string_additional_props:
          foo: bar
          first_additional: first
          second_additional: second
          third_additional: third
        true_additional_props:
          foo: bar
          first_additional: can be anything
          second_additional: 123
          third_additional: true
        false_additional_props:
          foo: bar
        only_additional_props_primitive:
          first_additional: first
          second_additional: second
          third_additional: third
        only_additional_props_object:
          first_additional:
            foo: first
            bar: [1, 2, 3]
          second_additional:
            foo: second
            bar: [4, 5, 6]
          third_additional:
            foo: third
            bar: [7, 8, 9]
  invalid:
    - id: obj-additional-props-wrong-type-number
      value:
        any_additional_props:
          foo: bar
        obj_additional_props:
          foo: bar
          invalid_prop: 123
        string_additional_props:
          foo: bar
        true_additional_props:
          foo: bar
        false_additional_props:
          foo: bar
        only_additional_props_primitive: {}
        only_additional_props_object: {}

    - id: obj-additional-props-missing-fizz
      value:
        any_additional_props:
          foo: bar
        obj_additional_props:
          foo: bar
          invalid_prop:
            buzz: 42
        string_additional_props:
          foo: bar
        true_additional_props:
          foo: bar
        false_additional_props:
          foo: bar
        only_additional_props_primitive: {}
        only_additional_props_object: {}

    - id: obj-additional-props-missing-buzz
      value:
        any_additional_props:
          foo: bar
        obj_additional_props:
          foo: bar
          invalid_prop:
            fizz: value
        string_additional_props:
          foo: bar
        true_additional_props:
          foo: bar
        false_additional_props:
          foo: bar
        only_additional_props_primitive: {}
        only_additional_props_object: {}

    - id: obj-additional-props-wrong-fizz-type
      value:
        any_additional_props:
          foo: bar
        obj_additional_props:
          foo: bar
          invalid_prop:
            fizz: 123
            buzz: 42
        string_additional_props:
          foo: bar
        true_additional_props:
          foo: bar
        false_additional_props:
          foo: bar
        only_additional_props_primitive: {}
        only_additional_props_object: {}

    - id: obj-additional-props-wrong-buzz-type
      value:
        any_additional_props:
          foo: bar
        obj_additional_props:
          foo: bar
          invalid_prop:
            fizz: value
            buzz: "should be number"
        string_additional_props:
          foo: bar
        true_additional_props:
          foo: bar
        false_additional_props:
          foo: bar
        only_additional_props_primitive: {}
        only_additional_props_object: {}

    # Wrong types for additional properties in string_additional_props
    - id: string-additional-props-wrong-type-number
      value:
        any_additional_props:
          foo: bar
        obj_additional_props:
          foo: bar
        string_additional_props:
          foo: bar
          invalid_prop: 123
        true_additional_props:
          foo: bar
        false_additional_props:
          foo: bar
        only_additional_props_primitive: {}
        only_additional_props_object: {}

    - id: string-additional-props-wrong-type-boolean
      value:
        any_additional_props:
          foo: bar
        obj_additional_props:
          foo: bar
        string_additional_props:
          foo: bar
          invalid_prop: true
        true_additional_props:
          foo: bar
        false_additional_props:
          foo: bar
        only_additional_props_primitive: {}
        only_additional_props_object: {}

    - id: string-additional-props-wrong-type-object
      value:
        any_additional_props:
          foo: bar
        obj_additional_props:
          foo: bar
        string_additional_props:
          foo: bar
          invalid_prop:
            nested: object
        true_additional_props:
          foo: bar
        false_additional_props:
          foo: bar
        only_additional_props_primitive: {}
        only_additional_props_object: {}

    - id: string-additional-props-wrong-type-array
      value:
        any_additional_props:
          foo: bar
        obj_additional_props:
          foo: bar
        string_additional_props:
          foo: bar
          invalid_prop: [1, 2, 3]
        true_additional_props:
          foo: bar
        false_additional_props:
          foo: bar
        only_additional_props_primitive: {}
        only_additional_props_object: {}

    - id: false-additional-props-not-allowed-additional
      value:
        any_additional_props:
          foo: bar
        obj_additional_props:
          foo: bar
        string_additional_props:
          foo: bar
        true_additional_props:
          foo: bar
        false_additional_props:
          foo: bar
          not_allowed: true
        only_additional_props_primitive: {}
        only_additional_props_object: {}

    # Wrong types for additional properties in only_additional_props_primitive
    - id: only-additional-props-primitive-wrong-type-number
      value:
        any_additional_props:
          foo: bar
        obj_additional_props:
          foo: bar
        string_additional_props:
          foo: bar
          invalid_prop: 123
        true_additional_props:
          foo: bar
        false_additional_props:
          foo: bar
        only_additional_props_primitive:
          foo: 1
          buzz: 2
        only_additional_props_object: {}

    # Wrong types for additional properties in only_additional_props_object
    - id: only-additional-props-object-wrong-type
      value:
        any_additional_props:
          foo: bar
        obj_additional_props:
          foo: bar
        string_additional_props:
          foo: bar
          invalid_prop: 123
        true_additional_props:
          foo: bar
        false_additional_props:
          foo: bar
        only_additional_props_primitive: {}
        only_additional_props_object:
          first: not an object
          second:
            foo: 1
            bar: "not an array"
