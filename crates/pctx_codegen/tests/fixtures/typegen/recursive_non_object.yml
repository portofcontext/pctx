schema:
  type: object
  properties:
    value:
      $ref: "#/$defs/Any"

  "$defs":
    Any:
      anyOf:
        - type: string
        - type: number
        - type: object
          additionalProperties:
            $ref: "#/$defs/Any"

tests:
  valid:
    - id: string-value
      value:
        value: hello
    - id: number-value
      value:
        value: 42
    - id: recursive-object
      value:
        value:
          foo: hello
          bar:
            baz: 42
  invalid:
    - id: boolean-value
      value:
        value: true
