
# Windows-specific linker configuration to avoid PDB errors
[target.x86_64-pc-windows-msvc]
# Use lld-link instead of link.exe to avoid PDB size limits (LNK1318)
# lld-link is LLVM's linker and doesn't have the same PDB limitations as MSVC's link.exe
linker = "rust-lld"
# Disable incremental compilation and debug info to avoid LNK1318 PDB size limits
# Use /DEBUG:NONE to completely disable PDB generation
# /NODEFAULTLIB:libcmt to suppress LNK4098 warning
rustflags = [
    "-C",
    "incremental=off",
    "-C",
    "debuginfo=0",
    "-C",
    "codegen-units=256",
    "-C",
    "link-arg=/DEBUG:NONE",
    "-C",
    "link-arg=/NODEFAULTLIB:libcmt",
    "-C",
    "link-arg=/INCREMENTAL:NO",
    "-C",
    "link-arg=/OPT:NOREF",
]

[alias]
pctx = "run -p pctx --"
# Hot reload: rebuild and restart `pctx start` on source changes
dev = [
    "watch",
    "-w",
    "crates",
    "-w",
    "Cargo.toml",
    "-w",
    "Cargo.lock",
    "-x",
    "run -p pctx -- start",
]
dev-v = [
    "watch",
    "-w",
    "crates",
    "-w",
    "Cargo.toml",
    "-w",
    "Cargo.lock",
    "-x",
    "run -p pctx -- start -v",
]
dev-vv = [
    "watch",
    "-w",
    "crates",
    "-w",
    "Cargo.toml",
    "-w",
    "Cargo.lock",
    "-x",
    "run -p pctx -- start -vv",
]
